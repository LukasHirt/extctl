# extctl.yaml — pipeline configuration
# Copy this to extctl.yaml and fill in the values.
# Never commit extctl.yaml if it contains real URLs or project keys you
# don't want public. Credentials must be set as env vars; never put them
# in this file:
#   EXTCTL_JIRA_EMAIL — your Atlassian account email
#   EXTCTL_JIRA_TOKEN — your Atlassian API token (id.atlassian.com/manage-profile/security/api-tokens)

timezone: Europe/Prague
fresh_candidates_per_day: 3 # always 3; not configurable per the ownCloud agreement

target_repo:
  remote: owncloud/web-extensions # GitHub repo for PRs
  # Fixed local path extctl owns exclusively — never point this at a checkout
  # you work in yourself. If nothing exists here yet, extctl clones it (via
  # `gh repo clone`); on every subsequent run it fetches and hard-resets it
  # onto origin/<default_branch>. This is the default — override only if you
  # want the checkout somewhere other than the extctl working directory.
  checkout: '.extctl-checkout'

marketplace_repo:
  remote: owncloud/marketplace # GitHub repo `extctl publish` opens PRs against
  # Same convention as target_repo.checkout — extctl-owned, safe to hard-reset.
  checkout: '.extctl-marketplace-checkout'
  default_branch: main

default_branch: main

jira:
  base_url: 'https://jira.example.com' # your Jira Server/DC base URL
  project: '' # project key
  # Exact status names from your Jira workflow — must match literally:
  candidate_status: 'Needs Approval'
  pick_status: 'Doing'
  decline_status: 'Not Doing'
  build_status: 'Done'    # set automatically when the PR is merged
  poll_interval_min: 10

claude:
  version_pin: '' # e.g. "2.1.0"; empty = use whatever is installed
  max_repair_attempts: 3  # gate → repair loop retries before giving up
  max_rebase_attempts: 2  # rebase-conflict-repair retries before falling back to a blocked draft PR
  budget_usd_per_build: 8
  budget_usd_per_day: 20

decay:
  max_appearances: 3 # 1 initial + 2 carryovers
  action: backlog # backlog | decline | ask

media:
  # Saves a demo video + up to max_screenshots screenshots to
  # runs/<date>/<id>/media/ after every successful gate, captured from the
  # e2e stage's own Playwright run. Local artifacts only — nothing is
  # uploaded or linked anywhere. Requires `ffmpeg` on PATH for the video;
  # screenshots still work without it.
  enabled: true
  max_screenshots: 3
  max_video_mb: 8

publish:
  # extension.yaml's `license` is read per-extension from that extension's
  # own package.json — if that field is missing, publish fails that
  # extension rather than guessing a license. `authors` has no per-extension
  # source in extctl, so it's a fixed org-wide value here; review/edit it in
  # the opened PR before merge if a specific extension needs something
  # different.
  authors:
    - name: ownCloud GmbH
      url: https://owncloud.com
  # tags and minOCIS are never configured globally here — both are
  # per-extension values. tags: reused verbatim from this extension's most
  # recent prior marketplace release if one exists, else inferred by Claude
  # from its package.json/README (prompts.infer_tags), else left empty with
  # a note in the PR for a human to add before merging (marketplace CI
  # requires at least one). minOCIS: reused from the previous release if one
  # exists, else inferred as the latest stable owncloud/ocis release that
  # existed on or before this extension's first commit date (a heuristic,
  # flagged in the PR — not a verified compatibility check), else left
  # unset (it's optional) with a PR note.
  # Upper bound only — Claude decides the actual count per extension (see
  # prompts/marketplace-screenshots.md) and is told to prefer fewer,
  # meaningfully distinct screenshots over padding to this number.
  max_screenshots: 3
  # Screenshot capture only runs THIS one Playwright project (chrome/
  # firefox/webkit), not the extension's full browser matrix — running the
  # other two just to discard their results triples capture time for no
  # benefit in the common case.
  screenshot_project: chrome
  # Per-extension override (app-id without web-app- prefix -> project) for
  # the rare extension whose functionality is genuinely restricted to one
  # browser (e.g. a chrome-only casting API) rather than merely preferring
  # it. Add an entry only once you've confirmed a specific extension needs
  # it — this is a manual escape hatch, not something extctl detects
  # automatically.
  screenshot_project_overrides: {}
  # screenshot_project_overrides:
  #   cast: chrome

prompts:
  gen_specs: 'prompts/gen-specs.md'
  plan: 'prompts/plan-extension.md'
  derive_stages: 'prompts/derive-stages.md'
  build_stage: 'prompts/build-stage.md'
  build_summary: 'prompts/build-summary.md'
  repair: 'prompts/repair.md'
  rebase_repair: 'prompts/rebase-repair.md'
  revise: 'prompts/revise.md'
  infer_tags: 'prompts/infer-tags.md' # used by `extctl publish` when an extension has no prior marketplace release to reuse tags from
  marketplace_screenshots: 'prompts/marketplace-screenshots.md' # used by `extctl publish` to write a fresh, dedicated screenshot spec per extension

idea_pool: 'idea-pool.yaml'
runs_dir: 'runs'
scaffold_dir: 'scaffold'             # local scaffold directory (populated by `extctl scaffold fetch`)
delivered_yaml: 'runs/delivered.yaml' # pre-pipeline manually-built extensions (dedup guard)

scaffold:
  source: 'https://github.com/owncloud/web-app-skeleton'
  # Files/dirs from the skeleton to skip when fetching. Paths ending in /
  # match the whole directory tree. The defaults already exclude CI/CD infra,
  # community docs, pnpm-lock.yaml, and extctl-owned template files (src/,
  # package.json, vite.config.ts). Override here to add or remove entries.
  exclude: []  # empty = use built-in defaults
